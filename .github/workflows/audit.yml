name: Dependency audit

# A new advisory can turn this red on any day, whatever changed. So it runs weekly and on the pull requests that
# change dependencies, never on the others.
on:
  pull_request:
    paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Reads the lockfile only, so nothing is installed. Dev dependencies count: they run on every machine and in CI.
      - run: pnpm audit --audit-level high
